name: "Publish"

on:
  push:
    branches:
      - "master"

jobs:
  generate:
    name: "Generate"
    runs-on: "ubuntu-slim"

    permissions:
      contents: "read"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7.0.1"

      - name: "Generate"
        run: "bash .github/scripts/generate.sh"

      - name: "Package"
        uses: "actions/upload-pages-artifact@v5.0.0"
        with:
          path: "public"

  ship:
    name: "Ship"
    runs-on: "ubuntu-slim"
    needs: "generate"

    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"

    permissions:
      id-token: "write"
      pages: "write"

    steps:
      - name: "Push"
        uses: "actions/deploy-pages@v5.0.0"
