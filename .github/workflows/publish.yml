name: "Publish"

on:
  push:
    branches:
      - "master"

permissions:
  contents: "read"
  id-token: "write"
  pages: "write"

jobs:
  generate:
    name: "Generate"
    runs-on: "ubuntu-slim"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7.0.1"

      - name: "Generate"
        run: "bash scripts/generate.sh"

      - name: "Package"
        uses: "actions/upload-pages-artifact@v5.0.0"
        with:
          path: "public"

  ship:
    name: "Ship"
    runs-on: "ubuntu-slim"
    needs: "generate"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: "Push"
        uses: "actions/deploy-pages@v5.0.0"
