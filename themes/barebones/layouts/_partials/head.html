<meta charset="utf-8"/>

<title>{{ .Title }}</title>
<meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Description }}{{ end }}"/>
<meta name="author" content="{{ .Site.Params.author }}"/>

<meta name="viewport" content="width=device-width, initial-scale=1"/>

{{ $css := collections.Slice (resources.Get "css/style.css") (resources.Get "css/syntax.css") | resources.Concat "css/bundle.css" }}

{{ if hugo.IsProduction }}
  {{ $css = $css | resources.Minify }}
{{ end }}

<link rel="stylesheet" href="{{ $css.RelPermalink }}" />

{{ range .AlternativeOutputFormats }}
<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink | safe.URL }}" title="{{ $.Site.Title }}"/>
{{ end }}
